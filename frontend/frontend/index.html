<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexus AI | Assistente Inteligente</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <div class="logo">
                <span class="logo-icon">✦</span>
                <h1>Nexus <span>AI</span></h1>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                Assistente virtual
            </div>
        </header>

        <section class="chat-area" id="chatArea">

            <div class="welcome" id="welcome">
                <div class="welcome-icon">✦</div>

                <h2>Olá! Eu sou o Nexus.</h2>

                <p>
                    Seu assistente inteligente.
                    Como posso ajudar você hoje?
                </p>

                <div class="suggestions">
                    <button class="suggestion">
                        Explique inteligência artificial
                    </button>

                    <button class="suggestion">
                        Me ensine Python
                    </button>

                    <button class="suggestion">
                        Ajude com meus estudos
                    </button>
                </div>
            </div>

        </section>

        <form class="input-area" id="chatForm">

            <input
                type="text"
                id="userInput"
                placeholder="Digite sua mensagem..."
                autocomplete="off"
                required
            >

            <button type="submit" id="sendButton">
                ➤
            </button>

        </form>

        <footer>
            Nexus AI · Inteligência artificial
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
